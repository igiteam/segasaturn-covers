<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sega Saturn Games Collection</title>

  <link rel="icon" href="https://cdn.gitgpt.chat/rtx/images/sega-saturn-logo.png" type="image/png">
  <link rel="apple-touch-icon" href="https://cdn.gitgpt.chat/rtx/images/sega-saturn-logo.png" sizes="180x180">
  <link rel="icon" type="image/png" href="https://cdn.gitgpt.chat/rtx/images/sega-saturn-logo.png" sizes="192x192">
  <link rel="icon" type="image/png" href="https://cdn.gitgpt.chat/rtx/images/sega-saturn-logo.png" sizes="512x512">
  <meta itemprop="name" content="Sega Saturn Games Collection">
  <meta property="og:title" content="Sega Saturn Games Collection">
  <meta property="og:url" content="">
  <meta property="og:type" content="website">
  <meta name="twitter:title" content="Sega Saturn Games Collection">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="apple-touch-icon" href="https://cdn.gitgpt.chat/rtx/images/Sega Saturn-icon.png" sizes="180x180">

  <link rel="apple-touch-icon" href="https://cdn.gitgpt.chat/rtx/images/Sega Saturn-icon.png" sizes="180x180">

  <style>
    body {
      background-color: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 4px 20px;
      padding: 0;
    }

    #results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
      max-width: 1400px;
      margin: 0 auto;
      background-color: #1a1a1a;
      margin-top: 4px;
      z-index: 1000;
    }

    .title-card {
      background: #2a2a2a;
      border-radius: 8px;
      overflow: hidden;
      transition: transform 0.2s;
    }

    .title-card:hover {
      transform: scale(1.05);
      z-index: 10;
    }

    .title-card-link {
      display: block;
      text-decoration: none;
      color: inherit;
    }

    .title-card-container {
      width: 100%;
      position: relative;
    }

    .title-card-image-container {
      width: 100%;
      aspect-ratio: 4/3;
      overflow: hidden;
      position: relative;
      background-color: #1a1a1a;
    }

    .title-card-image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.3s;
    }

    .title-card-image-container .fallback-title {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 10px;
      box-sizing: border-box;
      background: linear-gradient(135deg, #2a2a2a 0%, #1a1a1a 100%);
      color: #888;
      font-size: 14px;
      font-weight: 500;
      word-break: break-word;
      border: 1px solid #333;
    }

    .fill-color-Playable {
      background-color: #42991b !important;
      color: white !important;
      font-weight: 700 !important;
    }

    .card-body {
      flex: 1 1 auto;
      min-height: 1px;
      padding: 0.5rem 1.25rem !important;
    }

    .text-center {
      text-align: center !important;
    }

    .py-1 {
      padding-top: 0.25rem !important;
      padding-bottom: 0.25rem !important;
    }

    .my-0 {
      margin-top: 0 !important;
      margin-bottom: 0 !important;
    }

    small {
      font-size: 80%;
    }

    /* Search container */
    #saved-search-container {
      position: sticky;
      z-index: 10000;
      margin-left: auto;
      margin-right: auto;
      margin: 8px 0px;
    }

    #saved-search-input {
      padding: 10px;
      width: calc(100% - 20px);
      border: 1px solid #555;
      border-radius: 4px;
      background: #444;
      color: white;
      flex: 1;
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon {
      width: 34px;
      height: 34px;
      border-radius: 4px;
      object-fit: cover;
    }

    #saved-search-input::placeholder {
      color: #aaa;
    }

    #saved-results-count {
      color: white;
      font-size: 14px;
      text-align: center;
      margin-top: 5px;
    }

    /* Hide classes */
    .hidden-game {
      display: none !important;
    }

    .title-card.image-failed {
      display: none !important;
    }

    .title-card-link.hidden-game {
      display: none !important;
    }
  </style>
</head>

<body>
  <div id="saved-search-container">
    <div class="search-row">
      <a href="https://www.Sega Saturn9x.com/" target="_blank">
        <img src="https://cdn.gitgpt.chat/rtx/images/Sega Saturn-icon.png" class="icon" alt="Sega Saturn logo">
      </a>
      <input type="text" id="saved-search-input" placeholder="Search games...">
      <a href="https://segaretro.org/SSF" target="_blank">
        <img src="https://cdn.gitgpt.chat/rtx/images/Sega Saturn-controller.png" class="icon" alt="Sega Saturn">
      </a>
      <a href="https://cdn.gitgpt.chat/rtx/Sega Saturn_magazine.html" target="_blank">
        <img src="https://cdn.gitgpt.chat/rtx/images/Sega Saturn_magazine.png" class="icon" alt="Sega Saturn Magazine">
      </a>
    </div>
    <div id="saved-results-count"></div>
  </div>

  <div class="row" id="results">

  </div>

  <script>
    // Convert title cards to links for search
    function wrapCardsWithLinks() {
      document.querySelectorAll('.title-card').forEach(card => {
        // Skip if image failed
        if (card.classList.contains('image-failed')) return;

        const title = card.getAttribute('data-title-name');
        const status = card.getAttribute('data-title-status');

        // Remove existing inner link
        const existingInnerLink = card.querySelector('a');
        if (existingInnerLink) {
          while (existingInnerLink.firstChild) {
            card.insertBefore(existingInnerLink.firstChild, existingInnerLink);
          }
          existingInnerLink.remove();
        }

        let url_path = '';
        if (title) {
          url_path = title
            .toLowerCase()
            .replace(/[^\w\s-]/g, '')
            .replace(/\s+/g, '-')
            .replace(/-+/g, '-')
            .replace(/^-|-$/g, '');
        }

        if (url_path) {
          const urlParams = new URLSearchParams(window.location.search);
          const targetUrl = urlParams.get('url');

          const link = document.createElement('a');

          if (targetUrl) {
            link.href = targetUrl.replace(/\/$/, '') + '/Sega Saturn/' + url_path;
          } else {
            link.href = 'https://meyt.netlify.app/search/' + url_path + ' Sega Saturn';
          }
          link.className = 'title-card-link';
          link.rel = 'noopener noreferrer';
          link.target = '_blank';

          if (title) link.setAttribute('data-title-name', title);
          if (status) link.setAttribute('data-title-status', status);

          card.parentNode.insertBefore(link, card);
          link.appendChild(card);
        }
      });
    }

    // Run link wrapping after a delay
    setTimeout(wrapCardsWithLinks, 500);

    // Search functionality - target title-card-link elements
    document.getElementById('saved-search-input').addEventListener('input', function (e) {
      const searchTerm = e.target.value.toLowerCase();
      const links = document.querySelectorAll('.title-card-link');
      let count = 0;

      links.forEach(link => {
        const title = link.getAttribute('data-title-name') || '';

        if (title.toLowerCase().includes(searchTerm) && searchTerm) {
          link.classList.remove('hidden-game');
          count++;
        } else if (searchTerm) {
          link.classList.add('hidden-game');
        } else {
          link.classList.remove('hidden-game');
        }
      });

      document.getElementById('saved-results-count').textContent =
        searchTerm ? `Found ${count} game${count !== 1 ? 's' : ''}` : '';
    });

    // Keyboard shortcut
    document.addEventListener('keydown', function (e) {
      if (e.key === '/' && !document.getElementById('saved-search-input').matches(':focus')) {
        e.preventDefault();
        document.getElementById('saved-search-input').focus();
      }
    });

    // Initial hide of any images that already failed
    document.querySelectorAll('.title-card img').forEach(img => {
      if (img.complete && img.naturalHeight === 0) {
        img.closest('.title-card').classList.add('image-failed');
      }
    });
  </script>
</body>

</html>
